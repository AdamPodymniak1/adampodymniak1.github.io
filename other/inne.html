<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adam Podymniak</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="../index.html" class="back-home">
    Home
  </a>

<main>

<section>
  <div class="sim-header">
    <h2>Navier-Stokes Fluid Simulation</h2>
    <button id="reset">Reset</button>
  </div>
  <div class="canvas-wrapper border">
    <canvas id="canvas"></canvas>
  </div>
</section>

<section>
  <div class="sim-header">
    <h2>Mandelbrot Set</h2>
    <button id="resetMandelbrot">Reset</button>
  </div>
  <div class="canvas-wrapper border">
    <canvas id="mandelbrot"></canvas>
  </div>
</section>

<section>
  <div class="sim-header">
    <h2>Sand Simulation</h2>
    <div>
      <select id="material">
        <option value="1">Sand</option>
        <option value="2">Water</option>
        <option value="3">Wall</option>
        <option value="4">Remove</option>
      </select>
      <button id="resetSand">Reset</button>
    </div>
  </div>
  <div class="canvas-wrapper border">
    <canvas id="sand"></canvas>
  </div>
</section>

<section>
  <div class="sim-header">
    <h2>Boids</h2>
    <div>
      <input
        id="boidsCount"
        type="range"
        min="10"
        max="300"
        value="120"
        step="10"
      />
      <button id="resetBoids">Reset</button>
    </div>
  </div>
  <div class="canvas-wrapper border">
    <canvas id="boids"></canvas>
  </div>
</section>

<section>
  <div class="sim-header">
    <h2>Conway's Game of Life</h2>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <button id="playPauseLife">Stop</button>
      <button id="resetLife">Clear</button>
      <input id="lifeSpeed" type="range" min="1" max="60" value="30" title="Speed" />
    </div>
  </div>
  <div class="canvas-wrapper border">
    <canvas id="life"></canvas>
  </div>
</section>

</main>

<script src="navier_strokes.js"></script>
<script src="mandelbrot.js"></script>
<script src="sand.js"></script>
<script src="boids.js"></script>
<script src="life.js"></script>

</body>
</html>
