<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creative Simulations</title>
<style>
:root {
  --bg: #000;
  --fg: #fff;
  --border: #444;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: monospace;
}
main {
  display: flex;
  flex-direction: column;
  gap: 60px;
  padding: 20px;
}
section {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}
.sim-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
button {
  background: rgba(0,0,0,0.7);
  color: #fff;
  border: 1px solid #666;
  padding: 6px 14px;
  border-radius: 5px;
  cursor: pointer;
  font-family: monospace;
}
button:hover {
  background: rgba(80,80,80,0.7);
}
.canvas-wrapper {
  width: 100%;
  max-width: 600px;
  aspect-ratio: 1 / 1;
  margin: auto;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.placeholder {
  opacity: 0.5;
  text-align: center;
  padding: 40px 10px;
}
</style>
</head>
<body>

<main>

<section id="fluid">
  <div class="sim-header">
    <h2>Navier–Stokes Fluid Simulation</h2>
    <button id="resetButton">Reset</button>
  </div>
  <div class="canvas-wrapper">
    <canvas id="canvas"></canvas>
  </div>
</section>

<section>
  <h2>Mandelbrot Set</h2>
  <div class="placeholder">Coming soon.</div>
</section>

<section>
  <h2>Sand Simulation</h2>
  <div class="placeholder">Coming soon.</div>
</section>

<section>
  <h2>Game of Life</h2>
  <div class="placeholder">Coming soon.</div>
</section>

<section>
  <h2>Boids</h2>
  <div class="placeholder">Coming soon.</div>
</section>

</main>

<script>
const N = 100;
const ITER = 4;
const DIFF = 0.0001;
const VISC = 0.0001;
const DT = 0.1;
const size = (N + 2) * (N + 2);
const IX = (x, y) => x + (N + 2) * y;

const densityR = new Float32Array(size);
const densityG = new Float32Array(size);
const densityB = new Float32Array(size);
const sR = new Float32Array(size);
const sG = new Float32Array(size);
const sB = new Float32Array(size);
const Vx = new Float32Array(size);
const Vy = new Float32Array(size);
const Vx0 = new Float32Array(size);
const Vy0 = new Float32Array(size);

let colorCycle = 0;

function setBnd(b, x) {
  for (let i = 1; i <= N; i++) {
    x[IX(0,i)] = b === 1 ? -x[IX(1,i)] : x[IX(1,i)];
    x[IX(N+1,i)] = b === 1 ? -x[IX(N,i)] : x[IX(N,i)];
    x[IX(i,0)] = b === 2 ? -x[IX(i,1)] : x[IX(i,1)];
    x[IX(i,N+1)] = b === 2 ? -x[IX(i,N)] : x[IX(i,N)];
  }
}

function linSolve(b, x, x0, a, c) {
  for (let k = 0; k < ITER; k++) {
    for (let i = 1; i <= N; i++) {
      for (let j = 1; j <= N; j++) {
        x[IX(i,j)] =
          (x0[IX(i,j)] +
            a * (
              x[IX(i-1,j)] +
              x[IX(i+1,j)] +
              x[IX(i,j-1)] +
              x[IX(i,j+1)]
            )) / c;
      }
    }
    setBnd(b, x);
  }
}

function diffuse(b, x, x0, diff) {
  linSolve(b, x, x0, DT * diff * N * N, 1 + 4 * DT * diff * N * N);
}

function advect(b, d, d0, u, v) {
  const dt0 = DT * N;
  for (let i = 1; i <= N; i++) {
    for (let j = 1; j <= N; j++) {
      let x = i - dt0 * u[IX(i,j)];
      let y = j - dt0 * v[IX(i,j)];
      x = Math.max(0.5, Math.min(N + 0.5, x));
      y = Math.max(0.5, Math.min(N + 0.5, y));
      const i0 = Math.floor(x);
      const i1 = i0 + 1;
      const j0 = Math.floor(y);
      const j1 = j0 + 1;
      const s1 = x - i0;
      const s0 = 1 - s1;
      const t1 = y - j0;
      const t0 = 1 - t1;
      d[IX(i,j)] =
        s0 * (t0 * d0[IX(i0,j0)] + t1 * d0[IX(i0,j1)]) +
        s1 * (t0 * d0[IX(i1,j0)] + t1 * d0[IX(i1,j1)]);
    }
  }
  setBnd(b, d);
}

function project(u, v, p, div) {
  for (let i = 1; i <= N; i++) {
    for (let j = 1; j <= N; j++) {
      div[IX(i,j)] = -0.5 * (
        u[IX(i+1,j)] - u[IX(i-1,j)] +
        v[IX(i,j+1)] - v[IX(i,j-1)]
      ) / N;
      p[IX(i,j)] = 0;
    }
  }
  linSolve(0, p, div, 1, 4);
  for (let i = 1; i <= N; i++) {
    for (let j = 1; j <= N; j++) {
      u[IX(i,j)] -= 0.5 * N * (p[IX(i+1,j)] - p[IX(i-1,j)]);
      v[IX(i,j)] -= 0.5 * N * (p[IX(i,j+1)] - p[IX(i,j-1)]);
    }
  }
}

function step() {
  diffuse(1, Vx0, Vx, VISC);
  diffuse(2, Vy0, Vy, VISC);
  project(Vx0, Vy0, Vx, Vy);
  advect(1, Vx, Vx0, Vx0, Vy0);
  advect(2, Vy, Vy0, Vx0, Vy0);
  project(Vx, Vy, Vx0, Vy0);
  diffuse(0, sR, densityR, DIFF);
  diffuse(0, sG, densityG, DIFF);
  diffuse(0, sB, densityB, DIFF);
  advect(0, densityR, sR, Vx, Vy);
  advect(0, densityG, sG, Vx, Vy);
  advect(0, densityB, sB, Vx, Vy);
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let cellSize = 1;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cellSize = rect.width / N;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 1; i <= N; i++) {
    for (let j = 1; j <= N; j++) {
      ctx.fillStyle = `rgb(
        ${Math.min(255, densityR[IX(i,j)] * 200)},
        ${Math.min(255, densityG[IX(i,j)] * 200)},
        ${Math.min(255, densityB[IX(i,j)] * 200)}
      )`;
      ctx.fillRect(
        (i - 1) * cellSize,
        (j - 1) * cellSize,
        cellSize,
        cellSize
      );
    }
  }
}

function getColor() {
  const t = Date.now() * 0.001 + colorCycle;
  colorCycle += 0.01;
  return [
    (Math.sin(t) + 1) * 5,
    (Math.sin(t + 2.094) + 1) * 5,
    (Math.sin(t + 4.188) + 1) * 5
  ];
}

let down = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("pointerdown", e => {
  down = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener("pointerup", () => down = false);
canvas.addEventListener("pointerleave", () => down = false);

canvas.addEventListener("pointermove", e => {
  if (!down) return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor(((e.clientX - rect.left) / rect.width) * N);
  const y = Math.floor(((e.clientY - rect.top) / rect.height) * N);
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  if (x > 1 && x < N && y > 1 && y < N) {
    Vx[IX(x,y)] += dx * 0.2;
    Vy[IX(x,y)] += dy * 0.2;
    const c = getColor();
    densityR[IX(x,y)] += c[0];
    densityG[IX(x,y)] += c[1];
    densityB[IX(x,y)] += c[2];
  }
  lastX = e.clientX;
  lastY = e.clientY;
});

document.getElementById("resetButton").onclick = () => {
  densityR.fill(0);
  densityG.fill(0);
  densityB.fill(0);
  Vx.fill(0);
  Vy.fill(0);
};

(function loop() {
  step();
  render();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
