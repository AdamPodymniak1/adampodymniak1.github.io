<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adam Podymniak</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:monospace;
}
main {
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:60px;
}
section {
  border:1px solid #444;
  border-radius:10px;
  padding:16px;
}
.sim-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  flex-wrap:wrap;
}
button {
  background:rgba(0,0,0,0.7);
  color:#fff;
  border:1px solid #666;
  padding:6px 14px;
  border-radius:5px;
  cursor:pointer;
  font-family:monospace;
}
.canvas-wrapper {
  width:100%;
  max-width:600px;
  aspect-ratio:1/1;
  margin:auto;
}
canvas {
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}
.placeholder {
  opacity:0.5;
  text-align:center;
  padding:40px 10px;
}
.border {
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 12px;
  padding: 16px;
  background: rgba(255, 255, 255, 0.02);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.05),
    0 12px 30px rgba(0, 0, 0, 0.6);
}
select {
  background:rgba(0,0,0,0.7);
  color:#fff;
  border:1px solid #666;
  padding:6px 14px;
  border-radius:5px;
  cursor:pointer;
  font-family:monospace;
  min-width:150px;
  appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
  background-repeat:no-repeat;
  background-position:right 10px center;
  background-size:16px;
  padding-right:36px;
}
select:focus {
  outline:none;
  border-color:#888;
}
</style>
</head>
<body>

<main>

<section>
  <div class="sim-header">
    <h2>Navier–Stokes Fluid Simulation</h2>
    <button id="reset">Reset</button>
  </div>
  <div class="canvas-wrapper border">
    <canvas id="canvas"></canvas>
  </div>
</section>

<section>
  <div class="sim-header">
    <h2>Mandelbrot Set</h2>
    <button id="resetMandelbrot">Reset</button>
  </div>
  <div class="canvas-wrapper border">
    <canvas id="mandelbrot"></canvas>
  </div>
</section>

<section>
  <div class="sim-header">
    <h2>Sand Simulation</h2>
    <div>
      <select id="material">
        <option value="1">Sand</option>
        <option value="2">Water</option>
        <option value="3">Wall</option>
        <option value="4">Remove</option>
      </select>
      <button id="resetSand">Reset</button>
    </div>
  </div>
  <div class="canvas-wrapper border">
    <canvas id="sand"></canvas>
  </div>
</section>

<section><h2>Conways Game of Life</h2><div class="placeholder">Coming soon.</div></section>
<section><h2>Boids</h2><div class="placeholder">Coming soon.</div></section>
<section><h2>Newtons Fractal</h2><div class="placeholder">Coming soon.</div></section>

</main>

<script src="navier-strokes.js"></script>
<script src="mandelbrot.js"></script>
<script src="sand.js"></script>

</body>
</html>
